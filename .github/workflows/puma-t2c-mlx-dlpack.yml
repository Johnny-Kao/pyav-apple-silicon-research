name: PUMA T2C VideoToolbox MLX DLPack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlx-dlpack:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Environment fingerprint
        run: |
          echo "repo_sha=$GITHUB_SHA"
          uname -a
          uname -m
          sw_vers
          xcrun --show-sdk-version
          sysctl -n hw.model || true
          system_profiler SPHardwareDataType || true

      - name: Install FFmpeg, MLX, and build dependencies
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
          if ! pkg-config --exists libavformat 2>/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 3
          python -m pip install --upgrade pip
          python -m pip install "cython>=3.3,<4" setuptools wheel numpy mlx
          python - <<'PY'
          import mlx.core as mx
          print("mlx_import=ok")
          print("mlx_default_device=", mx.default_device())
          PY

      - name: Build research PyAV
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          python -m pip uninstall -y av || true
          python -m pip install --no-build-isolation .
          cd /tmp
          python - <<'PY'
          import av
          from av.codec.hwaccel import hwdevices_available

          print("pyav_version=", av.__version__)
          print("pyav_file=", av.__file__)
          print("hwdevices=", hwdevices_available())
          assert "videotoolbox" in hwdevices_available()
          assert hasattr(av.VideoFrame, "_research_videotoolbox_pixel_buffer_address")
          PY

      - name: Build Metal DLPack bridge
        run: |
          EXT_SUFFIX="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_config_var("EXT_SUFFIX"))
          PY
          )"
          clang -O3 -bundle -undefined dynamic_lookup -fobjc-arc \
            $(python3-config --includes) \
            -framework Foundation \
            -framework Metal \
            -framework CoreVideo \
            Tools/research/puma_metal_bridge.m \
            -o "/tmp/puma_metal_bridge${EXT_SUFFIX}"
          cd /tmp
          python - <<'PY'
          import puma_metal_bridge
          print("metal_device=", puma_metal_bridge.device_name())
          print("buffer_cache_available=", puma_metal_bridge.buffer_cache_available())
          assert puma_metal_bridge.buffer_cache_available()
          PY

      - name: Generate controlled H.264 clips
        run: |
          make_clip() {
            local size="$1"
            local frames="$2"
            local bitrate="$3"
            local out="$4"
            if ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "testsrc2=size=${size}:rate=60" \
              -frames:v "$frames" -an -pix_fmt nv12 \
              -c:v h264_videotoolbox -b:v "$bitrate" -g 60 -bf 0 "$out"; then
              echo "generated $out with h264_videotoolbox"
            else
              ffmpeg -hide_banner -loglevel error -y \
                -f lavfi -i "testsrc2=size=${size}:rate=60" \
                -frames:v "$frames" -an \
                -c:v libx264 -preset ultrafast -tune zerolatency -g 60 -bf 0 "$out"
            fi
          }
          make_clip 1920x1080 180 12M /tmp/puma1080.mp4
          make_clip 3840x2160 120 35M /tmp/puma4k.mp4

      - name: Run VideoToolbox to MLX zero-copy decision batch
        run: |
          cd /tmp
          PYTHONPATH=/tmp python "$GITHUB_WORKSPACE/Tools/research/puma_t2c_mlx_dlpack.py" \
            /tmp/puma1080.mp4 /tmp/puma4k.mp4 \
            --frames 120 --rgb-frames 60 \
            > /tmp/puma_t2c_mlx_dlpack.json
          cat /tmp/puma_t2c_mlx_dlpack.json

      - name: Decision summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("/tmp/puma_t2c_mlx_dlpack.json")
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with out.open("a") as f:
              f.write("## PUMA T2C — VideoToolbox → DLPack → MLX\n\n")
              f.write(f"- research commit: {os.environ['GITHUB_SHA']}\n")
              if not (p.exists() and p.stat().st_size):
                  f.write("- result: NOT EXECUTED / failed before JSON output\n")
              else:
                  data = json.loads(p.read_text())
                  f.write(f"- PyAV: {data['pyav_version']}\n\n")
                  f.write("| frame | MLX DLPack | raw MTLBuffer | NV12 transfer | RGB NumPy | transfer/DLPack | RGB/DLPack | same handle | copy=False |\n")
                  f.write("|---|---:|---:|---:|---:|---:|---:|---|---|\n")
                  for case in data["cases"]:
                      s = case["summary"]
                      c = case["capability"]
                      label = f"{s['width']}x{s['height']}"
                      f.write(
                          f"| {label} | {s['mlx_dlpack_median_us']:.2f} us | "
                          f"{s['metal_buffer_median_us']:.2f} us | "
                          f"{s['transfer_nv12_median_us']:.2f} us | "
                          f"{s['rgb_numpy_median_us']:.2f} us | "
                          f"{s['transfer_over_dlpack']:.1f}x | "
                          f"{s['rgb_over_dlpack']:.1f}x | "
                          f"{c['same_metal_buffer_handle']} | "
                          f"{c['copy_false_succeeded']} |\n"
                      )
                      f.write(
                          f"\n- {label}: DLPack device={c['original_dlpack']['device_type']}:{c['original_dlpack']['device_id']}; "
                          f"bytes={c['original_dlpack']['length']}; "
                          f"forced checksum={c['forced_read_checksum']}\n"
                      )
          PY
